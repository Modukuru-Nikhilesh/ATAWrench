  <!-- cyan HUD ring -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- amber wrench -->
  <g transform="rotate(45 32 32)">
    <rect x="27" y="30" width="10" height="28" rx="4" fill="#ffb300"/>
